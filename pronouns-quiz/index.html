<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인칭 대명사 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 인칭 대명사 문제집과 같은 민트 공책 */
  :root{
    --desk:#eef5f2; --paper:#fffef9; --ink:#2f3b37; --soft:#76857f; --rule:#dbe9e3;
    --mint:#2f9e7f; --mint-soft:#dff2eb; --hl:#fff1a8; --ok:#2c8a5a; --ok-soft:#e1f4e8; --bad:#d4553f; --bad-soft:#fbe7e2;
    --kr:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--kr);line-height:1.7;font-size:15.5px}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
  .book{background:var(--paper);border-radius:6px 18px 18px 6px;box-shadow:0 10px 30px rgba(40,80,70,.12);border-left:10px solid var(--mint);padding:22px 24px 26px}
  .jp{font-family:var(--jp)}
  ruby rt{font-size:.5em;color:var(--mint);font-family:var(--jp)}
  .hello{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .hello img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff;box-shadow:0 2px 10px rgba(40,80,70,.18)}
  h1{margin:0;font-size:24px;font-weight:400}
  h1 b{font-family:var(--jp);color:var(--mint)}
  .sub{margin:2px 0 0;color:var(--soft);font-size:14px}
  .kinds{background:#fff;border:1px dashed #bcd9cd;border-radius:12px;padding:10px 16px;font-size:14.5px;margin:0 0 14px}
  .kinds li{margin:2px 0}
  button{font:inherit;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--mint)}
  button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  button.main{background:var(--mint);color:#fff;border-color:var(--mint);font-weight:bold}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .best{font-size:13px;color:var(--soft);margin:10px 0 0}
  /* 문제 */
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
  .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:8px 0 16px}
  .bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
  .tag{display:inline-block;font-size:12px;background:var(--hl);border-radius:999px;padding:1px 10px;margin-bottom:6px}
  .ask{font-size:17px;margin:0 0 6px}
  .big{font-family:var(--jp);font-weight:700;font-size:46px;text-align:center;line-height:2;margin:4px 0}
  .sent{font-family:var(--jp);font-size:22px;text-align:center;line-height:2.2;margin:6px 0 0}
  .sent .blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--mint);margin:0 4px}
  .ko{text-align:center;color:var(--soft);font-size:14.5px;margin:0 0 4px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .opts button{border-radius:14px;padding:10px 8px;font-size:17px;line-height:1.9}
  .opts button.jp{font-size:22px}
  .opts button.right{border-color:var(--ok);background:var(--ok-soft)}
  .opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opts button:disabled{cursor:default;color:var(--ink)}
  .fb{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--mint-soft)}
  .fb.no{background:var(--bad-soft)}
  .fb img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
  .fb b{display:block}
  .fb span{font-size:14px}
  .next{display:flex;justify-content:flex-end;margin-top:12px}
  /* 결과 */
  .result{text-align:center}
  .face{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 14px rgba(40,80,70,.15)}
  .score{font-size:52px;font-weight:bold;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:8px}
  .score small{font-size:20px;color:var(--soft)}
  .review{text-align:left;margin-top:16px}
  .review h3{font-size:16px;margin:0 0 8px;font-weight:400}
  .rv{background:var(--bad-soft);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:14px}
  .rv .q{color:var(--soft)}
  .rv .a{font-family:var(--jp);font-size:17px}
  .allok{background:var(--ok-soft);border-radius:12px;padding:10px;color:var(--ok)}
  .center{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .foot{text-align:center;color:var(--soft);font-size:12px;margin-top:20px}
  .foot a{color:var(--mint)}
  @media (max-width:520px){ .book{padding:18px 14px 22px} .big{font-size:40px} .sent{font-size:19px} .opts button.jp{font-size:19px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="book" id="app"></div>
  <div class="foot"><a href="../pronouns/">인칭 대명사 문제집으로</a> · <a href="../">처음으로</a><br>캐릭터 그림 © nagano · 개인 학습용 팬 페이지 · 기록은 이 기기 브라우저에만 저장돼요</div>
</div>

<script>
// 표기: {漢字|かな} = 후리가나, ＿＿ = 빈칸
// 문제: k=종류, q=물음, show=크게 보여줄 것, sent=빈칸 문장, ko=한국어 해석, a=정답, o=오답들, why=해설
const BANK = [
  // 뜻 고르기
  {k:"뜻", q:"이 말의 뜻은?", show:"{彼女|かのじょ}", a:"그녀", o:["그","저 사람","너"], why:"彼女는 '그녀', '여자친구'라는 뜻도 있어요."},
  {k:"뜻", q:"이 말의 뜻은?", show:"{皆|みな}さん", a:"여러분", o:["우리","그들","당신"], why:"여러 사람을 부를 때 써요."},
  {k:"뜻", q:"이 말의 뜻은?", show:"{誰|だれ}", a:"누구", o:["어디","무엇","언제"], why:"공손하게는 どなた라고 해요."},
  {k:"뜻", q:"이 말의 뜻은?", show:"あの{方|かた}", a:"저 분", o:["저 사람","그 사람","저것"], why:"あの人(저 사람)의 높임말이에요."},
  {k:"뜻", q:"이 말의 뜻은?", show:"{彼|かれ}ら", a:"그들", o:["우리","그녀","여러분"], why:"ら·たち는 '~들'이에요."},
  // 읽기 고르기
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"君", a:"きみ", o:["くん","かれ","ぼく"], jp:true, why:"君(きみ) = 너. 이름 뒤 「~君(くん)」과는 읽기가 달라요."},
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"僕", a:"ぼく", o:["おれ","わたし","きみ"], jp:true, why:"僕(ぼく) = 남자가 쓰는 부드러운 '나'."},
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"俺", a:"おれ", o:["ぼく","おまえ","かれ"], jp:true, why:"俺(おれ) = 친구끼리 쓰는 거친 '나'."},
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"彼女", a:"かのじょ", o:["かれじょ","かのおんな","かのひと"], jp:true, why:"彼女(かのじょ). 彼(かれ)와 첫 글자 읽기가 달라요."},
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"お前", a:"おまえ", o:["おぜん","おまい","おさき"], jp:true, why:"お前(おまえ) = 거친 '너'."},
  {k:"읽기", q:"어떻게 읽을까요?", plainShow:"誰", a:"だれ", o:["どれ","なに","どこ"], jp:true, why:"誰(だれ) = 누구."},
  // 빈칸 채우기
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"＿＿は{医者|いしゃ}です。", ko:"그는 의사입니다.", a:"{彼|かれ}", o:["{彼女|かのじょ}","{私|わたし}","{君|きみ}"], jp:true, why:"彼 = 그 (남자)."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"＿＿は{日本人|にほんじん}です。", ko:"그녀는 일본 사람입니다.", a:"{彼女|かのじょ}", o:["{彼|かれ}","あなた","{僕|ぼく}"], jp:true, why:"彼女 = 그녀."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"＿＿、こんにちは。", ko:"여러분, 안녕하세요.", a:"{皆|みな}さん", o:["{彼|かれ}ら","{私|わたし}たち","あの{人|ひと}"], jp:true, why:"皆さん = 여러분."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"これは＿＿の{傘|かさ}ですか。", ko:"이건 누구의 우산이에요?", a:"{誰|だれ}", o:["{彼|かれ}","あなた","{君|きみ}"], jp:true, why:"誰の = 누구의."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"＿＿は{友達|ともだち}です。", ko:"우리는 친구입니다.", a:"{私|わたし}たち", o:["{彼|かれ}ら","{皆|みな}さん","あなた"], jp:true, why:"私たち = 우리."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"あの＿＿は{先生|せんせい}です。", ko:"저 분은 선생님입니다.", a:"{方|かた}", o:["{人|ひと}","{彼|かれ}","{君|きみ}"], jp:true, why:"あの方 = 저 분 (あの人보다 공손)."},
  {k:"빈칸", q:"빈칸에 알맞은 말은?", sent:"＿＿の{名前|なまえ}は{何|なん}ですか。", ko:"당신의 이름은 무엇입니까?", a:"あなた", o:["{誰|だれ}","{彼|かれ}ら","{俺|おれ}"], jp:true, why:"あなた = 당신. 실제로는 이름+さん으로 부르는 게 더 자연스러워요."},
  // 상황 고르기
  {k:"상황", q:"친한 남자 친구에게 「내가 갈게!」라고 할 때, 가장 자연스러운 '나'는?", a:"{俺|おれ}", o:["{私|わたくし}","あなた","{彼|かれ}"], jp:true, why:"남자끼리 편하게 말할 때는 俺."},
  {k:"상황", q:"회사 면접에서 「저는 ○○라고 합니다」라고 할 때 쓰는 '저'는?", a:"{私|わたくし}", o:["{俺|おれ}","あたし","{僕|ぼく}"], jp:true, why:"아주 정중한 자리에서는 わたくし."},
  {k:"상황", q:"'그녀' 말고 '여자친구'라는 뜻도 있는 말은?", a:"{彼女|かのじょ}", o:["あの{人|ひと}","{皆|みな}さん","あの{方|かた}"], jp:true, why:"「彼女がいます」 = 여자친구가 있어요."},
  {k:"상황", q:"선생님을 가리켜 「저 분」이라고 공손하게 말할 때는?", a:"あの{方|かた}", o:["あの{人|ひと}","{お前|おまえ}","{君|きみ}"], jp:true, why:"あの方 = 저 분."},
  {k:"상황", q:"여자아이가 친구에게 편하게 「나도 가고 싶어!」라고 할 때 '나'는?", a:"あたし", o:["{俺|おれ}","{私|わたくし}","{彼女|かのじょ}"], jp:true, why:"あたし = 여자가 쓰는 친근한 '나'."},
  {k:"상황", q:"윗사람에게 쓰면 실례가 되는 '너'는?", a:"{お前|おまえ}", o:["あなた","{田中|たなか}さん","あの{方|かた}"], jp:true, why:"お前는 아주 친한 사이나 거친 말투에서만 써요."}
];
const KINDS = {뜻:"뜻 고르기", 읽기:"읽기 고르기", 빈칸:"빈칸 채우기", 상황:"상황 고르기"};
const N = 15;

const $ = s => document.querySelector(s), app = $("#app");
const RUBY = /\{([^|{}]+)\|([^{}]*)\}/g;
const rb = s => s.replace(RUBY,(m,k,r)=>r?`<ruby>${k}<rt>${r}</rt></ruby>`:k).replace(/＿＿/g,'<span class="blank"></span>');
const plain = s => s.replace(RUBY,(m,k,r)=>r||k);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja")); if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

let Q=null;
function pickSet(){ // 종류가 고루 섞이게: 종류별로 섞은 뒤 돌아가며 뽑기
  const by={}; shuffle(BANK).forEach(b=>(by[b.k]=by[b.k]||[]).push(b));
  const out=[]; let ks=Object.keys(by);
  while(out.length<N && ks.some(k=>by[k].length)) ks.forEach(k=>{ if(out.length<N && by[k].length) out.push(by[k].pop()); });
  return shuffle(out);
}
function start(list){ Q={list:list.map(b=>({b, opts:shuffle([b.a,...b.o])})), i:0, picked:null, right:0, wrong:[]}; show(); window.scrollTo(0,0); }

function home(){
  const best=store("pq-best");
  app.innerHTML=`<div class="hello"><img src="../chiikawa/hachi.jpg" alt="하치와레"><div><h1>인칭 대명사 <b>퀴즈</b></h1>
    <p class="sub">문제집에서 배운 わたし·あなた·かれ… 얼마나 기억나는지 확인해요. 한 번에 ${N}문제, 풀 때마다 바로 정답을 알려줘요.</p></div></div>
    <ul class="kinds"><li><b>뜻 고르기</b> — 彼女는 무슨 뜻?</li><li><b>읽기 고르기</b> — 僕는 어떻게 읽을까?</li>
    <li><b>빈칸 채우기</b> — ＿＿は医者です (그는 의사입니다)</li><li><b>상황 고르기</b> — 면접에서 쓰는 '저'는?</li></ul>
    <div class="row"><button class="main" id="go">퀴즈 시작</button><a href="../pronouns/"><button>문제집 먼저 보기</button></a></div>
    <p class="best">${best!=null?`최고 점수 ${best} / ${N}`:"아직 기록이 없어요"}</p>`;
  $("#go").onclick=()=>start(pickSet());
}

function show(){
  const it=Q.list[Q.i], b=it.b, n=Q.list.length, done=Q.picked!=null, ok=done&&it.opts[Q.picked]===b.a;
  let body="";
  if(b.show||b.plainShow) body=`<p class="ask">${b.q}</p><div class="big">${b.plainShow||rb(b.show)}</div>`;
  else if(b.sent) body=`<p class="ask">${b.q}</p><div class="sent">${rb(b.sent)}</div><p class="ko">${b.ko}</p>`;
  else body=`<p class="ask">${b.q}</p>`;
  app.innerHTML=`<div class="top"><span>${Q.i+1} / ${n} · 맞힘 ${Q.right}</span><button id="quit" style="font-size:12px;padding:3px 10px">그만하기</button></div>
    <div class="bar"><i style="width:${(Q.i+(done?1:0))/n*100}%"></i></div>
    <span class="tag">${KINDS[b.k]}</span>${body}
    <div class="opts">${it.opts.map((o,k)=>{ let c=b.jp?"jp":""; if(done){ if(o===b.a) c+=" right"; else if(k===Q.picked) c+=" wrong"; }
      return `<button class="${c}" data-k="${k}" ${done?"disabled":""}>${rb(o)}</button>`; }).join("")}</div>
    ${done?`<div class="fb ${ok?"":"no"}" role="status"><img src="${ok?"../chiikawa/chii.jpg":"../chiikawa/hachi.jpg"}" alt=""><div><b>${ok?"⭕ 정답! えらい！":"❌ 아쉬워요 — 정답은 "+rb(b.a)}</b><span>${b.why}</span></div></div>
      <div class="next"><button class="main" id="next">${Q.i+1<n?"다음 문제":"결과 보기"}</button></div>`:""}`;
  $("#quit").onclick=()=>{ Q=null; home(); };
  app.querySelector(".opts").onclick=e=>{ const x=e.target.closest("button[data-k]"); if(x) answer(+x.dataset.k); };
  if(done){ $("#next").onclick=next; $("#next").focus({preventScroll:true}); }
}
function answer(k){
  if(Q.picked!=null) return; Q.picked=k;
  const it=Q.list[Q.i];
  if(it.opts[k]===it.b.a) Q.right++; else Q.wrong.push({b:it.b, mine:it.opts[k]});
  if(it.b.jp) speak(plain(it.b.a));
  show();
}
function next(){ Q.i++; Q.picked=null; if(Q.i>=Q.list.length) result(); else show(); }

function result(){
  const n=Q.list.length, r=Q.right, rate=r/n;
  if(n===N){ store("pq-best", Math.max(store("pq-best")||0, r)); }
  const face = rate>=.9?"../chiikawa/chii.jpg":rate>=.7?"../chiikawa/usagi.jpg":"../chiikawa/hachi.jpg";
  const msg = rate>=.9?"완벽해요! 인칭 대명사는 이제 마스터 すごい！":rate>=.7?"잘했어요! 틀린 것만 다시 보면 완벽해요.":"괜찮아요, 문제집을 한 번 더 보고 다시 도전!";
  app.innerHTML=`<div class="result"><img class="face" src="${face}" alt="">
    <div class="score">${r}<small> / ${n}</small></div><p><b>${msg}</b></p>
    <div class="center">${Q.wrong.length?`<button class="main" id="retry">틀린 ${Q.wrong.length}문제 다시</button>`:""}<button id="again">새 퀴즈</button><button id="home">처음으로</button></div>
    <div class="review">${Q.wrong.length?`<h3>틀린 문제</h3>`+Q.wrong.map(w=>`<div class="rv"><div class="q">${w.b.sent?rb(w.b.sent)+" — "+w.b.ko:w.b.q+(w.b.show||w.b.plainShow?" "+(w.b.plainShow||rb(w.b.show)):"")}</div>
      <div>정답 <span class="a">${rb(w.b.a)}</span> · 내 답 <span class="a" style="color:var(--bad)">${rb(w.mine)}</span></div><div class="q">${w.b.why}</div></div>`).join(""):`<div class="allok">전부 맞았어요! 💮</div>`}</div></div>`;
  if($("#retry")) $("#retry").onclick=()=>start(Q.wrong.map(w=>w.b));
  $("#again").onclick=()=>start(pickSet());
  $("#home").onclick=()=>{ Q=null; home(); };
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!Q||e.ctrlKey||e.metaKey||e.altKey||Q.i>=Q.list.length) return;
  if(Q.picked==null && /^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key-1); }
});
home();
</script>
</body>
</html>
